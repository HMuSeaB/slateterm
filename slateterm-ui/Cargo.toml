[package]
name = "slateterm-ui"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "SlateTerm's own component set, drawn on GPUI"
publish = false

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.10", features = ["test-support"] }
gpui-kit = "=0.8.1"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_HiDpi"
] }

[workspace]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
