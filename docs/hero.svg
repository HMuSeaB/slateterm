  <text x="1076" y="155" fill="#F7F4EA" font-size="15" font-family="Segoe UI, Arial, sans-serif">Split</text>
  <rect x="116" y="222" width="210" height="56" rx="18" fill="#171E29" stroke="#6D5221"/>
  <text x="147" y="256" fill="#F7F4EA" font-size="16" font-family="Segoe UI, Arial, sans-serif">PowerShell 7</text>
  <rect x="344" y="222" width="188" height="56" rx="18" fill="#171E29" stroke="#224452"/>
  <text x="376" y="256" fill="#F7F4EA" font-size="16" font-family="Segoe UI, Arial, sans-serif">Claude Code</text>
  <text x="118" y="338" fill="#F7F4EA" font-size="48" font-family="Segoe UI, Arial, sans-serif" font-weight="700">A Windows terminal that stays local.</text>
  <text x="118" y="388" fill="#A6B0BB" font-size="22" font-family="Segoe UI, Arial, sans-serif">Traditional shell flow, native-feeling tabs, split panes, and an optional Claude Code entry.</text>
  <text x="118" y="422" fill="#A6B0BB" font-size="22" font-family="Segoe UI, Arial, sans-serif">No sign-in wall. No cloud-first workflow. Just a terminal you can actually settle into.</text>
  <rect x="118" y="476" width="154" height="54" rx="18" fill="#14302F" stroke="#2A6D69"/>
  <text x="160" y="510" fill="#E9F7F5" font-size="18" font-family="Segoe UI, Arial, sans-serif">Tauri 2</text>
  <rect x="286" y="476" width="128" height="54" rx="18" fill="#2E2414" stroke="#7C5D1D"/>
  <text x="331" y="510" fill="#FFF5E3" font-size="18" font-family="Segoe UI, Arial, sans-serif">ConPTY</text>
  <rect x="428" y="476" width="141" height="54" rx="18" fill="#161F30" stroke="#30476E"/>
  <text x="467" y="510" fill="#EAF1FF" font-size="18" font-family="Segoe UI, Arial, sans-serif">xterm.js</text>
  <rect x="583" y="476" width="178" height="54" rx="18" fill="#1E1727" stroke="#4A3862"/>
  <text x="626" y="510" fill="#F1EBFF" font-size="18" font-family="Segoe UI, Arial, sans-serif">React + Rust</text>
  <rect x="848" y="250" width="278" height="266" rx="24" fill="#10161F" stroke="#263241"/>
  <text x="879" y="292" fill="#F7F4EA" font-size="24" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Built for daily use</text>
  <text x="879" y="334" fill="#A6B0BB" font-size="18" font-family="Segoe UI, Arial, sans-serif">• Shell-first startup</text>
  <text x="879" y="370" fill="#A6B0BB" font-size="18" font-family="Segoe UI, Arial, sans-serif">• Split panes and search</text>
  <text x="879" y="406" fill="#A6B0BB" font-size="18" font-family="Segoe UI, Arial, sans-serif">• Local settings persistence</text>
  <text x="879" y="442" fill="#A6B0BB" font-size="18" font-family="Segoe UI, Arial, sans-serif">• Optional AI CLI launch</text>
  <text x="879" y="478" fill="#A6B0BB" font-size="18" font-family="Segoe UI, Arial, sans-serif">• Native Windows frame</text>
