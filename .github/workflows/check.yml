name: Checks

# 只回答一个问题：这些改动能不能编过。
#
# 存在的理由很具体：本机 `src-tauri` 的 cargo 编译会被沙箱拦掉（rustc 的
# `.temp-archive` 报 os error 5），所以 Rust 那一层的类型错误在本机**完全看不见**。
# 2026-11-01 就是这样漏掉一个 `use grid::GridHub` 私有导入的。
#
# 和 `release.yml` 的分工：那边出安装包（十几分钟，带内嵌校验），这边只做
# 类型检查与单元测试（几分钟），每次推送都能跑。

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          # 两个 crate 各自有 target/，分开缓存
          workspaces: |
            src-tauri
            slateterm-grid

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check and build frontend
        # 顺序不能调：`pnpm build` 先 tsc 再 vite，产物落在 dist-stable；
        # 而 src-tauri 里的 `tauri::generate_context!()` 在**编译期**就要读这个目录，
        # 不存在会直接报错。所以必须先编前端再 cargo check。
        run: pnpm build

      - name: Test the grid crate
        # 自绘网格的全部逻辑都在这里，且不依赖 Tauri，能真正跑起来
        run: cargo test --manifest-path slateterm-grid/Cargo.toml

      - name: Type-check the Tauri crate
        # 只做类型检查，不出二进制：比 release 构建快一个量级。
        # attach 客户端是同一个 crate 的另一个 bin，`cargo check` 会一并检查。
        run: cargo check --manifest-path src-tauri/Cargo.toml
