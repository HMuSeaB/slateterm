name: Build Windows release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build
        required: true
        default: v1.1.0
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        shell: pwsh
        # 产物名跟着 tag 走，不再硬编码版本号。workflow_dispatch 用输入值，
        # push tag 触发时从 ref 名取。
        run: |
          $ref = "${{ github.ref_name }}"
          if ("${{ github.event_name }}" -eq "workflow_dispatch") { $ref = "${{ inputs.tag }}" }
          echo "VERSION=$ref" >> $env:GITHUB_OUTPUT

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the attach client first
        # 主程序的 build.rs 会把客户端二进制内嵌进去，从而发布版只需一个 exe。
        # 但 Cargo 不保证两个 bin 的编译顺序，首次构建时客户端可能还没编出来，
        # 内嵌就会落空。先单独编一次客户端，保证主程序构建时它一定在。
        # --release 不能省：build.rs 按 PROFILE 取 target/<profile>/ 下的客户端，
        # 少了它客户端会编进 target/debug，而主程序是 release 构建、只看
        # target/release，内嵌就静默落空了（v1.1.1 就是这么坏掉的）。
        run: pnpm build:attach

      - name: Verify the attach client is embedded
        shell: pwsh
        # 内嵌落空时构建完全静默：build.rs 只打一条 cargo:warning，产物照样出，
        # 只是解压后找不到 slateterm-attach。v1.1.1 就是这么发布了空壳。
        # 这里直接查主程序里有没有客户端的独有字符串，把这类失败变成硬失败。
        # "用法：slateterm-attach" 只存在于客户端源码的 --help 输出，主程序和
        # 前端都没有，所以能当内嵌生效的佐证。
        run: |
          $exe = "src-tauri/target/release/slateterm.exe"
          $found = $false
          $stream = [System.IO.File]::OpenRead($exe)
          try {
            $reader = New-Object System.IO.StreamReader($stream, [System.Text.Encoding]::UTF8)
            while (-not $reader.EndOfStream) {
              $line = $reader.ReadLine()
              if ($line -and $line.Contains("用法：slateterm-attach")) { $found = $true; break }
            }
            $reader.Close()
          } finally {
            $stream.Dispose()
          }
          if (-not $found) {
            Write-Error "主程序里找不到内嵌的 slateterm-attach（搜不到客户端的 --help 文本）。构建顺序或 profile 不对，产物会是打不开 Remote attach 的空壳。"
            exit 1
          }
          Write-Host "OK: 主程序里确实内嵌了 slateterm-attach"

      - name: Stage standalone executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null
          # 只需主程序一个文件：slateterm-attach 已由 build.rs 内嵌进主程序，
          # 首次开启 remote attach 时会自己释放到 %LOCALAPPDATA%\SlateTerm\。
          Copy-Item src-tauri/target/release/slateterm.exe "release-artifacts/SlateTerm-${{ steps.version.outputs.VERSION }}-windows-x64.exe"
          $hash = (Get-FileHash "release-artifacts/SlateTerm-${{ steps.version.outputs.VERSION }}-windows-x64.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  SlateTerm-${{ steps.version.outputs.VERSION }}-windows-x64.exe" | Set-Content release-artifacts/SHA256SUMS.txt

      - name: Extract release notes
        id: notes
        shell: pwsh
        # 从 CHANGELOG 抽出当前版本那一节（到下一个 ## 之前）作为 Release 正文，
        # 这样仓库里维护一份、发布页自动跟上，不需要手写第二遍。
        run: |
          $version = "${{ steps.version.outputs.VERSION }}".TrimStart('v')
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern "^## v$version\b" | Select-Object -First 1)
          if (-not $start) { throw "CHANGELOG.md 里找不到 v$version 这一段" }
          $from = $start.LineNumber
          $end = $lines.Length
          for ($i = $from; $i -lt $lines.Length; $i++) {
            if ($lines[$i] -match '^## ') { $end = $i; break }
          }
          $body = ($lines[$from..($end - 1)] -join "`n")
          $body | Set-Content release-notes.md -Encoding utf8
          Write-Host $body

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: SlateTerm-${{ steps.version.outputs.VERSION }}-windows-x64
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 14

      # tag 推送触发时才真正建 Release。workflow_dispatch 走的是分支 ref，
      # 没有对应 tag 可挂，这一步会跳过，只留上面那份 Actions artifact。
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: SlateTerm ${{ steps.version.outputs.VERSION }}
          body_path: release-notes.md
          files: |
            release-artifacts/SlateTerm-${{ steps.version.outputs.VERSION }}-windows-x64.exe
            release-artifacts/SHA256SUMS.txt
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
