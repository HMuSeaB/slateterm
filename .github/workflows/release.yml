name: Build Windows release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build
        required: true
        default: v1.1.0
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        shell: pwsh
        # 产物名跟着 tag 走，不再硬编码版本号。workflow_dispatch 用输入值，
        # push tag 触发时从 ref 名取。
        run: |
          $ref = "${{ github.ref_name }}"
          if ("${{ github.event_name }}" -eq "workflow_dispatch") { $ref = "${{ inputs.tag }}" }
          echo "VERSION=$ref" >> $env:GITHUB_OUTPUT

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SlateTerm
        run: pnpm build:desktop

      - name: Stage standalone executables
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null
          Copy-Item src-tauri/target/release/slateterm.exe "release-artifacts/SlateTerm-${{ steps.version.outputs.VERSION }}-windows-x64.exe"
          # 附加客户端随主程序一起分发，放同一目录即可：主程序按自己所在目录查找
          # slateterm-attach.exe，不需要配置 externalBin。
          Copy-Item src-tauri/target/release/slateterm-attach.exe release-artifacts/slateterm-attach.exe
          Get-ChildItem release-artifacts/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Add-Content release-artifacts/SHA256SUMS.txt
          }

      - name: Extract release notes
        id: notes
        shell: pwsh
        # 从 CHANGELOG 抽出当前版本那一节（到下一个 ## 之前）作为 Release 正文，
        # 这样仓库里维护一份、发布页自动跟上，不需要手写第二遍。
        run: |
          $version = "${{ steps.version.outputs.VERSION }}".TrimStart('v')
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern "^## v$version\b" | Select-Object -First 1)
          if (-not $start) { throw "CHANGELOG.md 里找不到 v$version 这一段" }
          $from = $start.LineNumber
          $end = $lines.Length
          for ($i = $from; $i -lt $lines.Length; $i++) {
            if ($lines[$i] -match '^## ') { $end = $i; break }
          }
          $body = ($lines[$from..($end - 1)] -join "`n")
          $body | Set-Content release-notes.md -Encoding utf8
          Write-Host $body

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: SlateTerm-${{ steps.version.outputs.VERSION }}-windows-x64
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 14

      # tag 推送触发时才真正建 Release。workflow_dispatch 走的是分支 ref，
      # 没有对应 tag 可挂，这一步会跳过，只留上面那份 Actions artifact。
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: SlateTerm ${{ steps.version.outputs.VERSION }}
          body_path: release-notes.md
          files: |
            release-artifacts/SlateTerm-${{ steps.version.outputs.VERSION }}-windows-x64.exe
            release-artifacts/slateterm-attach.exe
            release-artifacts/SHA256SUMS.txt
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
