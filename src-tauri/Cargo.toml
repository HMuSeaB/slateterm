[package]
name = "slateterm"
version = "1.1.3"
description = "Local-first Windows terminal workspace"
authors = ["HMuSeaB"]
license = "MIT"
repository = "https://github.com/HMuSeaB/slateterm"
edition = "2021"
default-run = "slateterm"

[[bin]]
name = "slateterm-attach"
path = "src/bin/slateterm-attach.rs"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
png = "0.17.16"
portable-pty = "0.8.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.0.0", features = [] }
tokio = { version = "1.50.0", features = ["net", "io-util", "rt", "sync", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
windows-sys = { version = "0.59.0", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Com",
  "Win32_System_Console",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging"
] }
